name: E2E (Playwright)

on:
  push:
    branches: [master, main]
    paths:
      - "src/frontend/**"
      - "src/backend/dCMS.Web/App_Plugins/dCMS.ProductWizard/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "src/frontend/**"
      - "src/backend/dCMS.Web/App_Plugins/dCMS.ProductWizard/**"
      - ".github/workflows/e2e.yml"

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_TENANT_ID: ${{ vars.E2E_TENANT_ID }}
          E2E_STORE_ID: ${{ vars.E2E_STORE_ID }}
          E2E_STORE_USER: ${{ secrets.E2E_STORE_USER }}
          E2E_STORE_PASSWORD: ${{ secrets.E2E_STORE_PASSWORD }}
          E2E_BRAND_USER: ${{ secrets.E2E_BRAND_USER }}
          E2E_BRAND_PASSWORD: ${{ secrets.E2E_BRAND_PASSWORD }}
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7
