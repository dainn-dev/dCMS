<div class="dcms-notif-bell">
    <button type="button" class="btn btn-default btn-sm dcms-notif-toggle" ng-click="vm.toggleOpen()" title="Notifications">
        <span class="glyphicon glyphicon-bell" aria-hidden="true"></span>
        <span class="badge dcms-notif-badge" ng-if="vm.count > 0">{{ vm.count > 99 ? "99+" : vm.count }}</span>
    </button>
    <div class="dcms-notif-dropdown" ng-show="vm.open">
        <div class="dcms-notif-head">
            <strong>Notifications</strong>
            <span class="text-muted" style="font-size: 11px">(DAI-297)</span>
            <span ng-if="vm.canCatalogWrite === false" class="text-muted" style="font-size: 10px; margin-left: 4px">· read-only (DAI-298)</span>
        </div>
        <div ng-if="vm.busy" class="text-muted dcms-notif-pad">Updating…</div>
        <div ng-if="vm.error" class="text-danger dcms-notif-pad" style="font-size: 12px">{{ vm.error }}</div>
        <ul class="list-unstyled dcms-notif-list" ng-if="!vm.busy && !vm.error">
            <li ng-if="!vm.items.length" class="text-muted dcms-notif-pad">No notifications.</li>
            <li ng-repeat="it in vm.items track by it.id" class="dcms-notif-item" ng-class="{ read: it.readAt }" ng-click="vm.onItemClick(it)">
                <span class="dcms-notif-icon glyphicon" ng-class="vm.iconClass(it.type)"></span>
                <div class="dcms-notif-body">
                    <div class="dcms-notif-time">{{ it.createdAt | date:'yyyy-MM-dd HH:mm':'UTC' }} UTC</div>
                    <div class="dcms-notif-msg">{{ it.message }}</div>
                </div>
            </li>
        </ul>
    </div>
</div>
