# dCMS local stack (DAI-301 / M0): PostgreSQL (4 DBs), SQL Server (Umbraco CMS only), RabbitMQ, Redis, Elasticsearch,
# Catalog.Api, Inventory.Api, Order.Api + Payment.Api, Catalog.Worker, Umbraco Web (SQL Server + local Data volume).
# Application data APIs remain PostgreSQL-only; Umbraco uses MSSQL on port 14333 (host).
# Usage (repo root): docker compose -f infra/docker-compose.yml build
#                      docker compose -f infra/docker-compose.yml up -d
#                      docker compose -f infra/docker-compose.yml --profile test run --rm m1-domain-tests
# Apply SQL migrations after Postgres is healthy (see infra/README.md).

name: dcms

volumes:
  umbraco_mssql_data:
  umbraco_data:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Umbraco_Dev_2026!"
    ports:
      - "14333:1433"
    volumes:
      - umbraco_mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  umbraco-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Umbraco_Dev_2026!"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        sleep 3
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('Umbraco') IS NULL CREATE DATABASE Umbraco;"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcms
      POSTGRES_PASSWORD: Your_password123
      POSTGRES_DB: dcms_catalog
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms -d dcms_catalog -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    mem_limit: 1073741824

  gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    ports:
      - "5100:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__Enabled: "true"
      Auth__JwtSigningKey: "${JWT_SIGNING_KEY:-dcms-local-dev-signing-key-min-32-chars!!}"
      Auth__Issuer: "dcms-gateway"
      Auth__Audience: "dcms-services"
      Auth__InternalTokenTtlSeconds: "300"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5000"
      RateLimiting__PermitLimit: "500"
      RateLimiting__WindowSeconds: "60"
      ReverseProxy__Clusters__catalog-cluster__Destinations__default__Address: "http://catalog-api:8080"
      ReverseProxy__Clusters__orders-cluster__Destinations__default__Address: "http://order-api:8080"
      ReverseProxy__Clusters__inventory-cluster__Destinations__default__Address: "http://inventory-api:8080"
    depends_on:
      catalog-api:
        condition: service_healthy
      order-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy

  catalog-api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.catalog-api
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: "Host=postgres;Port=5432;Database=dcms_catalog;Username=dcms;Password=Your_password123"
      ConnectionStrings__Redis: "redis:6379"
      Elasticsearch__Url: "http://elasticsearch:9200"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  inventory-api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.inventory-api
    ports:
      - "5002:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Inventory: "Host=postgres;Port=5432;Database=dcms_inventory;Username=dcms;Password=Your_password123"
      ConnectionStrings__Audit: "Host=postgres;Port=5432;Database=dcms_catalog;Username=dcms;Password=Your_password123"
      ConnectionStrings__Redis: "redis:6379"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      InternalInventory__ApiKey: "dcms-local-internal-inventory-key-min-32-characters!!"
    depends_on:
      postgres:
        condition: service_healthy

  order-api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.order-api
    ports:
      - "5003:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Order: "Host=postgres;Port=5432;Database=dcms_order;Username=dcms;Password=Your_password123"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "guest"
      RabbitMq__Pass: "guest"
      Inventory__BaseUrl: "http://inventory-api:8080/"
      Inventory__InternalApiKey: "dcms-local-internal-inventory-key-min-32-characters!!"
      Payment__BaseUrl: "http://payment-api:8080/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      inventory-api:
        condition: service_healthy
      payment-api:
        condition: service_started

  payment-api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.payment-api
    ports:
      - "5004:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Payment: "Host=postgres;Port=5432;Database=dcms_payment;Username=dcms;Password=Your_password123"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "guest"
      RabbitMq__Pass: "guest"
      # DAI-341: replace in non-dev / real providers
      Payment__Providers__stub__WebhookSecret: "dev-webhook-secret"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  umbraco-web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.dcms-web
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 120s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # KeepAlive and internal callbacks use this; Kestrel listens on 8080 in the image (not 5000).
      Umbraco__CMS__WebRouting__UmbracoApplicationUrl: "http://localhost:8080/"
      ConnectionStrings__umbracoDbDSN: "Server=sqlserver,1433;Database=Umbraco;User Id=sa;Password=Umbraco_Dev_2026!;TrustServerCertificate=True;Encrypt=True"
      ConnectionStrings__umbracoDbDSN_ProviderName: "Microsoft.Data.SqlClient"
    volumes:
      - umbraco_data:/app/umbraco/Data
    depends_on:
      sqlserver:
        condition: service_healthy
      umbraco-db-init:
        condition: service_completed_successfully

  catalog-worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.catalog-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: "Host=postgres;Port=5432;Database=dcms_catalog;Username=dcms;Password=Your_password123"
      ConnectionStrings__Inventory: "Host=postgres;Port=5432;Database=dcms_inventory;Username=dcms;Password=Your_password123"
      ConnectionStrings__Redis: "redis:6379"
      Elasticsearch__Url: "http://elasticsearch:9200"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "guest"
      RabbitMq__Pass: "guest"
      RabbitMq__ManagementBaseUrl: "http://rabbitmq:15672"
    depends_on:
      catalog-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  m1-domain-tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.m1-domain-tests
    # Testcontainers (PostgreSQL, Elasticsearch) needs the host daemon + a routable host to reach published ports.
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
